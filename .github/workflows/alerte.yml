name: Alerte École Directe

on:
  schedule:
    - cron: "*/5 5-18 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: alerte-ed
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer l'état précédent
        uses: actions/cache/restore@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Vérifier École Directe
        env:
          ED_IDENTIFIANT: ${{ secrets.ED_IDENTIFIANT }}
          ED_MOTDEPASSE: ${{ secrets.ED_MOTDEPASSE }}
          ED_CN: ${{ secrets.ED_CN }}
          ED_CV: ${{ secrets.ED_CV }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alerte_ecoledirecte.py

      - name: Sauver l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: etat.json
          key: etat-${{ github.run_id }}
